<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수혈 실험대</title>
<style>
@font-face{font-family:'Label';src:url('./fonts/label.woff') format('woff');font-display:swap}
:root{
  --A:#14a38b;--B:#8b5cf6;
  --bench:#E7ECEA;--paper:#FFFFFF;--ink:#1D252C;--mute:#5B6770;--line:#C7D1CE;
  --blood:#B2182F;--bloodDeep:#7E0F21;--donorTint:#F7E7E9;
  --straw:#D99A0B;--strawDeep:#7F5800;--plasmaTint:#FBF0CF;
  --ok:#1E7A45;--bad:#C2192F;
  --tA:#F3C21A;--tB:#EE93B3;--tAB:#FFFFFF;--tO:#2F78BF;
  --disp:'Label','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bench);color:var(--ink);font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;line-height:1.55;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
body.embed{background:transparent}
main{max-width:1100px;margin:0 auto;padding:18px 16px 28px}
body.embed main{padding:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-family:var(--disp);font-weight:400;font-size:1.7rem;margin:0;letter-spacing:-.01em}
.top a{color:var(--mute);font-size:.9rem}
body.embed .top{display:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--tO);outline-offset:2px}

/* 수혈 카드: 주는 사람 → 받는 사람 */
.txcard{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:14px}
.bag{background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.bag .bar{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 12px;color:#fff;font-weight:700}
.bag .bar small{font-weight:400;opacity:.9;font-size:.8rem}
.bag.donor .bar{background:var(--blood)}
.bag.recip .bar{background:var(--strawDeep)}
.bag .body{display:flex;align-items:center;gap:14px;padding:10px 12px}
.tile{flex:0 0 auto;min-width:2.9em;height:1.75em;padding:0 .25em;display:flex;align-items:baseline;justify-content:center;padding-top:.32em;font-family:var(--disp);font-size:2.6rem;line-height:1;border:1.5px solid var(--ink);border-radius:4px}
.tile small{font-size:.38em;margin-left:.08em}
.t-A{background:var(--tA)}.t-B{background:var(--tB)}.t-AB{background:var(--tAB)}.t-O{background:var(--tO);color:#fff}
.bag .chg{display:flex;flex-direction:column;gap:5px;min-width:0}
.bag .chg span{font-size:.8rem;color:var(--mute)}
.types{display:flex;gap:4px;flex-wrap:wrap}
.tb{min-width:2.6em;padding:5px 8px;border:1.5px solid var(--line);border-radius:4px;background:var(--paper);font-weight:700;font-size:.92rem}
.tb.sel{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--ink)}
.tb:hover{border-color:var(--ink)}
.arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);font-weight:700;font-size:.85rem;padding:0 2px}
.arrow svg{width:46px;height:22px}
@media (max-width:640px){
  .txcard{gap:6px}
  .arrow{font-size:.75rem;padding:0}.arrow svg{width:26px}
  .bag .bar{padding:4px 8px;font-size:.92rem}.bag .bar small{display:none}
  .bag .body{flex-direction:column;align-items:stretch;gap:6px;padding:8px}
  .tile{font-size:2.2rem;height:1.6em;padding-top:.26em}
  .bag .chg span{display:none}
  .types{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
  .tb{min-width:0;padding:5px 0;font-size:.85rem}
}
/* 단계 */
.steps{display:flex;margin:0 0 10px;padding:0;list-style:none;counter-reset:s;border-bottom:1.5px solid var(--line)}
.steps li{counter-increment:s;flex:1 1 0;display:flex;align-items:center;gap:7px;padding:6px 4px 8px;font-size:.9rem;color:var(--mute);margin-bottom:-1.5px;border-bottom:3px solid transparent;white-space:nowrap;min-width:0}
.steps li::before{content:counter(s);flex:0 0 auto;display:grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;border:1.5px solid currentColor;font-weight:700;font-size:.8rem}
.steps li.now{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.steps li.now::before{background:var(--ink);border-color:var(--ink);color:#fff}
.steps li.done{color:var(--ok)}.steps li.done::before{content:'✓';background:var(--ok);border-color:var(--ok);color:#fff}
@media (max-width:560px){.steps li{font-size:.84rem;gap:4px;flex:0 0 auto;padding-right:10px}.steps li:not(.now) span{display:none}.steps li.now{flex:1 1 auto}}

.guide{margin:0 0 10px;font-size:1.05rem;font-weight:600;min-height:3.2em;color:var(--ink)}
@media (max-width:560px){.guide{font-size:.98rem;min-height:6.3em}}
.guide.ok{color:var(--ok)}.guide.no,.guide.bad{color:var(--bad)}

/* 실험대 */
#view{position:relative;width:100%;height:clamp(400px,56vw,600px);border-radius:6px;overflow:hidden;background:#F5F7F6;border:1.5px solid var(--ink);touch-action:none}
@media (max-width:700px){#view{height:min(178vw,820px)}}
#view canvas{position:relative;z-index:1;display:block;width:100%;height:100%}
.zone{position:absolute;z-index:0;transition:opacity .6s}
.zone .zl{position:absolute;top:10px;left:12px;font-weight:700;font-size:.92rem;padding:3px 10px;border-radius:3px;color:#fff}
#zoneD{background:var(--donorTint)}
#zoneD .zl{background:var(--blood)}
#zoneP{background:var(--plasmaTint);border-left:1.5px dashed var(--strawDeep)}
#zoneP.tall{border-left:0;border-top:1.5px dashed var(--strawDeep)}
#zoneP .zl{background:var(--strawDeep)}
#tags{position:absolute;inset:0;z-index:2;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,0);text-align:center;font-size:.88rem;font-weight:700;white-space:nowrap;transition:opacity .4s}
.tag .pick{display:inline-block;margin-top:3px;padding:1px 8px;border-radius:3px;font-size:.76rem;background:var(--paper);border:1px dashed var(--strawDeep);color:var(--strawDeep);font-weight:600}
.tag .pick.on{border-style:solid;background:var(--straw);border-color:var(--straw);color:#fff}
.hint{position:absolute;z-index:2;right:12px;top:13px;font-size:.78rem;color:var(--mute);pointer-events:none}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--mute);margin-top:8px;align-items:center}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:5px}

/* 제출 버튼 */
.submit{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:.5em;white-space:nowrap;
  padding:13px 26px 12px;border:0;border-radius:10px;font-family:var(--disp);font-size:1.2rem;font-weight:400;color:#fff;
  background:var(--c2);box-shadow:0 6px 0 var(--c3),0 10px 18px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s,filter .15s}
.submit svg{width:1.1em;height:1.1em}
.submit:hover{filter:brightness(1.08)}
.submit:active{transform:translateY(5px);box-shadow:0 1px 0 var(--c3),0 3px 8px rgba(0,0,0,.18)}
.submit.ready::after{content:'';position:absolute;inset:-5px;border-radius:14px;border:3px solid var(--c2);animation:ring 1.6s ease-out infinite;pointer-events:none}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.12,1.4)}}
#rbcBtn{--c2:var(--blood);--c3:var(--bloodDeep)}
#plasmaBtn{--c2:#C98700;--c3:#7F5800}
#rbcBtn:disabled{--c2:#9AA6AE;--c3:#6E7A82;cursor:not-allowed;filter:none}
.submit:disabled::after{display:none}
.ctag{position:absolute;transform:translate(-50%,-100%);z-index:2;pointer-events:none;font-size:.82rem;font-weight:700;color:#fff;background:var(--blood);padding:2px 9px;border-radius:3px}

/* 틀렸을 때 */
#boom{position:absolute;z-index:5;left:50%;top:45%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  font-family:var(--disp);font-size:clamp(2.6rem,8vw,4.8rem);color:#fff;background:var(--bad);padding:.06em .5em .1em;border-radius:8px;white-space:nowrap;box-shadow:0 8px 0 #7d0f1e}
#boom.show{animation:boom 1.1s ease-out}
@keyframes boom{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.16)}24%{transform:translate(-50%,-50%) scale(.95)}32%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#flash{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 6px var(--bad),inset 0 0 70px rgba(194,25,47,.3)}
#flash.show{animation:flash .6s ease-out}
@keyframes flash{0%,40%{opacity:1}100%{opacity:0}}
#view.shake{animation:vshake .5s}
@keyframes vshake{0%,100%{transform:none}12%{transform:translateX(-14px) rotate(-.6deg)}26%{transform:translateX(12px) rotate(.5deg)}40%{transform:translateX(-10px)}55%{transform:translateX(8px)}70%{transform:translateX(-5px)}85%{transform:translateX(3px)}}

/* 결과 도장: 응집 / 응집 없음 */
.stamp{position:absolute;z-index:4;left:18px;top:16px;transform-origin:20% 50%;pointer-events:none;font-family:var(--disp);font-size:clamp(2.6rem,9vw,5rem);line-height:1;
  padding:.12em .36em .16em;border:.09em solid currentColor;border-radius:.16em;background:rgba(255,255,255,.82);
  transform:rotate(-8deg);white-space:nowrap;outline:.04em solid currentColor;outline-offset:-.17em}
.stamp.yes{color:var(--bad)}
.stamp.no{color:#2D5B85;font-size:clamp(2rem,6.5vw,3.6rem)}
.stamp.show{animation:slam .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{0%{opacity:0;transform:rotate(-16deg) scale(2.6)}60%{opacity:1;transform:rotate(-7deg) scale(.92)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}

/* 기록 패널 */
#act{position:absolute;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));
  background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;padding:12px 14px 10px;text-align:center;box-shadow:0 8px 0 rgba(29,37,44,.12)}
#act .q{margin:0 0 10px;font-weight:600}
#act .q b{font-family:var(--disp);font-weight:400;font-size:1.15em}
#act .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch{padding:12px 8px 11px;border-radius:6px;border:1.5px solid var(--ink);background:var(--paper);font-family:var(--disp);font-size:1.15rem;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ch.yes.sel{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 0 #11502b}
.ch.no.sel{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 4px 0 #7d0f1e}
#act .link{margin-top:8px;border:0;background:none;color:var(--mute);text-decoration:underline;font-size:.88rem;padding:4px}

#soundBtn{position:absolute;z-index:3;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:5px;padding:4px 9px;font-size:.78rem;background:var(--paper);border:1px solid var(--line);border-radius:4px;color:var(--mute)}
#soundBtn svg{width:15px;height:15px}
#view.tall .hint{display:none}
#view.tall #soundBtn{left:auto;right:10px;top:10px;bottom:auto}
#view.tall .submit{font-size:1.08rem;padding:11px 20px 10px}
@media (prefers-reduced-motion:reduce){.submit.ready::after{animation:none}#view.shake,#boom.show,.stamp.show{animation:none}#boom.show{opacity:1}}
.hide{display:none!important}
</style>
</head>
<body><main>
<div class="top">
  <h1>수혈 실험대</h1>
  <a href="./">학생용 앱으로 가기</a>
</div>

<section class="txcard" aria-label="이번 실험의 수혈 조합">
  <div class="bag donor">
    <div class="bar">주는 사람 <small>혈액을 내주는 쪽</small></div>
    <div class="body">
      <div class="tile" id="tileD"></div>
      <div class="chg"><span>혈액형 바꾸기</span><div class="types" id="bd"></div></div>
    </div>
  </div>
  <div class="arrow" aria-hidden="true">
    <svg viewBox="0 0 46 22"><path d="M2 11h36" stroke="currentColor" stroke-width="3" fill="none"/><path d="M32 3l10 8-10 8" stroke="currentColor" stroke-width="3" fill="none" stroke-linejoin="round"/></svg>
    수혈
  </div>
  <div class="bag recip">
    <div class="bar">받는 사람 <small>혈액을 받는 쪽</small></div>
    <div class="body">
      <div class="tile" id="tileR"></div>
      <div class="chg"><span>혈액형 바꾸기</span><div class="types" id="br"></div></div>
    </div>
  </div>
</section>

<ol class="steps" id="steps">
  <li><span>적혈구 고르기</span></li><li><span>혈장 만들기</span></li><li><span>맞춰 보기</span></li><li><span>기록하기</span></li>
</ol>
<p id="res" class="guide" aria-live="polite"></p>

<div id="view">
  <div class="zone" id="zoneD"><span class="zl" id="zlD"></span></div>
  <div class="zone" id="zoneP"><span class="zl" id="zlP"></span></div>
  <div id="tags"></div>
  <div class="hint" id="hint"></div>
  <button id="rbcBtn" class="submit hide"><svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="tx">이 적혈구로 결정</span></button>
  <button id="plasmaBtn" class="submit ready hide"><svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>혈장 완성</button>
  <div id="ctag" class="ctag hide">고른 적혈구</div>
  <div id="stamp" class="stamp hide" aria-live="assertive"></div>
  <div id="flash"></div>
  <div id="boom" aria-live="assertive"></div>
  <div id="act" class="hide"></div>
  <button id="soundBtn"></button>
</div>
<div class="legend">
  <span><span class="dot" style="background:var(--A)"></span>응집원 A: 삼각뿔 머리</span>
  <span><span class="dot" style="background:var(--B)"></span>응집원 B: 공 모양 머리</span>
  <span><span class="dot" style="background:#5f7f9e"></span>응집소: Y자 끝에 홈 2개</span>
</div>
</main>

<script type="module">
import * as THREE from './lib/three.module.min.js';

/* =====================================================================
   모양 설정: 숫자를 바꾸면 3D 모형의 크기와 모양이 바뀝니다.
   ===================================================================== */
const SIZE = {
  rbcRadius: 1.6,       // 적혈구 반지름
  stalk: 0.32,          // 응집원 줄기 길이
  armLen: 0.7,          // 응집소 팔 길이
  stemLen: 0.8,         // 응집소 몸통 길이
  cupH: 0.46,           // 응집소 결합부위(홈 블록) 높이
  cupR: 0.3             // 결합부위 바깥 반지름
};
const COLOR = { A: 0x14a38b, B: 0x8b5cf6, rbc: 0xd23245, ab: 0x5f7f9e, pocket: 0xb9cde0 };
/* ===================================================================== */

const TY = ['A', 'B', 'AB', 'O'];
const ANTIGEN = { A: ['A'], B: ['B'], AB: ['A', 'B'], O: [] };
const ANTIBODY = { A: ['b'], B: ['a'], AB: [], O: ['a', 'b'] };
const FIT = { a: 'A', b: 'B' }, GREEK = { a: 'α', b: 'β' };
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const EMBED = new URLSearchParams(location.search).has('embed');   // 학생용 앱 안에 들어갈 때
if (EMBED) {
  document.body.classList.add('embed');
  const post = () => parent.postMessage({ type: 'bt-height', h: document.documentElement.scrollHeight }, '*');
  new ResizeObserver(post).observe(document.body); addEventListener('load', post);
}

/* ---------- 3D 기본 ---------- */
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
$('zoneP').after(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0xaebfd0, 1.4));
const key = new THREE.DirectionalLight(0xfff4e8, 2.4); key.position.set(5, 7, 9); scene.add(key);
const fill = new THREE.DirectionalLight(0xdbe8ff, 0.9); fill.position.set(-7, -3, 5); scene.add(fill);
const rimL = new THREE.DirectionalLight(0xffffff, 0.8); rimL.position.set(0, 4, -8); scene.add(rimL);

/* ---------- 모형 만들기 ---------- */
const R = SIZE.rbcRadius;
function rbcGeometry() {
  // 가운데가 오목한 원반 (적혈구 단면 곡선을 회전)
  const pts = [], N = 48, k = R * 0.9;
  const h = p => k * Math.sqrt(Math.max(0, 1 - p * p)) * (0.16 + 0.95 * p * p - 0.62 * p ** 4);
  for (let i = 0; i <= N; i++) { const p = Math.sin(i / N * Math.PI / 2); pts.push(new THREE.Vector2(p * R, h(p))); }
  for (let i = N - 1; i >= 0; i--) { const p = Math.sin(i / N * Math.PI / 2); pts.push(new THREE.Vector2(p * R, -h(p))); }
  const g = new THREE.LatheGeometry(pts, 96);
  g.rotateX(Math.PI / 2);
  return g;
}
const RBC_GEO = rbcGeometry();
const STALK_GEO = new THREE.CylinderGeometry(0.045, 0.06, SIZE.stalk + 0.08, 16);
const HEAD_A = new THREE.ConeGeometry(0.22, 0.36, 3); HEAD_A.translate(0, 0.18, 0);        // 삼각뿔, 밑면 중심이 원점
const HEAD_B = new THREE.SphereGeometry(0.18, 40, 24);                                     // 공, 중심이 원점
const DOCK_OUT = { A: R + SIZE.stalk, B: R + SIZE.stalk + 0.14 };                          // 중심에서 결합 기준점까지
const RBC_TILT = new THREE.Euler(-0.62, 0.3, 0);

function makeRBC(type) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhysicalMaterial({ color: COLOR.rbc, roughness: 0.42, clearcoat: 0.35, clearcoatRoughness: 0.5, sheen: 0.4, sheenColor: new THREE.Color(0xff9aa8) });
  const body = new THREE.Mesh(RBC_GEO, bodyMat);
  g.add(body);
  g.userData = { type, antigens: [], mats: [bodyMat] };
  const list = ANTIGEN[type];
  if (list.length) for (let i = 0; i < 6; i++) {
    const t = list[i % list.length], th = i / 6 * Math.PI * 2 + Math.PI / 6;
    const u = new THREE.Vector3(Math.cos(th), Math.sin(th), 0);
    const mat = new THREE.MeshStandardMaterial({ color: COLOR[t], roughness: 0.35, metalness: 0.05 });
    const hmat = mat.clone(); hmat.flatShading = t === 'A';
    const a = new THREE.Group();
    const stalk = new THREE.Mesh(STALK_GEO, mat); stalk.position.y = R - 0.04 + (SIZE.stalk + 0.08) / 2 - 0.04;
    const head = new THREE.Mesh(t === 'A' ? HEAD_A : HEAD_B, hmat);
    head.position.y = t === 'A' ? R + SIZE.stalk : DOCK_OUT.B;
    a.add(stalk, head);
    a.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), u);
    g.add(a);
    g.userData.antigens.push({ t, u, dock: u.clone().multiplyScalar(DOCK_OUT[t]), mats: [mat, hmat], bound: false });
    g.userData.mats.push(mat, hmat);
  }
  g.traverse(o => { if (o.isMesh) o.userData.rbc = g; });
  return g;
}

function cupGeometries(x) {
  // 바깥 블록과 홈(오목) 부분을 따로 만들어 홈 색을 밝게 보이게 합니다.
  const H = SIZE.cupH, Ro = x === 'a' ? 0.38 : SIZE.cupR, V = (a, b) => new THREE.Vector2(a, b);
  const pr = x === 'a' ? 0.25 : 0.2, seg = x === 'a' ? 3 : 48;
  const outer = [V(0, 0), V(Ro - 0.06, 0), V(Ro - 0.01, 0.04), V(Ro, 0.1), V(Ro, H - 0.05), V(Ro - 0.02, H - 0.005), V(pr + 0.02, H), V(pr, H)];
  const inner = [];
  if (x === 'a') { const depth = 0.38; for (let i = 0; i <= 8; i++) { const f = i / 8; inner.push(V(pr * (1 - f) + 0.0001, H - depth * f)); } }

/* ---------- 화면 배치: 왼쪽(위) = 주는 사람 적혈구, 오른쪽(아래) = 받는 사람 혈장 ---------- */

function doLayout() {

let audio = null, soundOn = true;

    if (ag.bound) return;
    const s = project(ag.dock.clone().applyMatrix4(rbc.matrixWorld));
    const cands = [[px, py, -1], ...[0, 1].map(k => { const m = project(mouthWorld(ab, k)); return [m.x, m.y, k]; })];
    cands.forEach(([x, y, k]) => { const d = Math.hypot(x - s.x, y - s.y); if (d < bd) { bd = d; best = { ag, k }; } });
  });
  if (best && best.k === -1) {
    const s = project(best.ag.dock.clone().applyMatrix4(rbc.matrixWorld));
    const d = [0, 1].map(k => { const m = project(mouthWorld(ab, k)); return Math.hypot(m.x - s.x, m.y - s.y); });
    best.k = d[0] <= d[1] ? 0 : 1;
  }
  return best;
}
function backToTray(ab) { tweenTo(ab, slots[ab.userData.x], slotQ, 400, () => { if (ab.userData.state === 'busy') ab.userData.state = 'tray'; }); }

function onDrop(ab, px, py) {
  highlight(null);
  const hit = nearestAntigen(ab, px, py);
  const x = ab.userData.x;
  if (!hit) { ab.userData.state = 'busy'; backToTray(ab); return; }
  if (FIT[x] !== hit.ag.t) {
    ab.userData.state = 'busy';
    wiggle(ab, new THREE.Vector3(0, 0, 1), () => backToTray(ab));
    wrong();
    (L.tried[x] = L.tried[x] || new Set()).add(hit.ag.t);
    // 혈장의 모든 응집소를 적혈구의 모든 응집원에 맞춰 봤는데 맞는 게 없으면 끝
    const kinds = new Set(ANTIGEN[sel.d]);
    const allTried = L.tray.every(o => [...kinds].every(g => FIT[o.userData.x] !== g ? (L.tried[o.userData.x] || new Set()).has(g) : false));
    if (allTried) {
      res(`응집소 ${GREEK[x]}의 홈에는 응집원 ${hit.ag.t}가 들어가지 않아요. 이 혈장에는 ${sel.d}형 적혈구의 응집원에 맞는 응집소가 하나도 없어요.`, 'no');
      setTimeout(() => finish(false), 700);
    } else res(`응집소 ${GREEK[x]}의 홈에는 응집원 ${hit.ag.t}가 들어가지 않아요. 다른 응집원이나 다른 응집소로도 해 보세요.`, 'no');
    return;
  }
  // 맞음: 끌어온 응집소가 결합하고, 같은 응집원 자리마다 같은 응집소가 따라 붙습니다
  const g = hit.ag.t;
  dock(ab, hit.k, hit.ag, 0);
  let n = 0;
  rbc.userData.antigens.forEach(ag => {
    if (ag.bound || ag.t !== g) return;
    const c = makeAntibody(x); c.userData.state = 'docked';
    c.position.copy(slots[x]); c.quaternion.copy(slotQ); scene.add(c);
    dock(c, n % 2, ag, 160 * (++n));
  });
  L.tray = L.tray.filter(o => o !== ab);
  res(`딱 맞아요! 응집소 ${GREEK[x]}의 홈에 응집원 ${g}가 끼워졌어요. 어떻게 되는지 지켜보세요.`, 'ok');
  const cur = L;
  setTimeout(() => { if (L === cur) clump(); }, 160 * n + 800);
}

/* 응집: 응집소가 남은 홈으로 다른 적혈구를 붙잡아 엉겨 붙는 모습 */
function clump() {
  const cur = L;
  L.tray.forEach(ab => { ab.userData.state = 'off'; fade(ab, 400); });
  L.tray = []; tagsEl.innerHTML = ''; hint('');
  const bridges = L.docked.slice(0, 6).filter((_, i) => i % 2 === 0);
  let far = 0;
  bridges.forEach((ab, i) => {
    const k = ab.userData.dockArm, o = 1 - k, ag = ab.userData.ag;
    const ak = ab.userData.arms[k].rotation.z, ao = ak + Math.PI, s0 = ab.userData.stem.rotation.z;
    const gap = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
    const sT = [ak + Math.PI / 2, ak - Math.PI / 2].sort((a, b) => gap(a, s0) - gap(b, s0))[0];
    const a0 = ab.userData.arms[o].rotation.z;
    setTimeout(() => { if (L !== cur) return; animate(600, t => {
      const e = ease(t);
      ab.userData.arms[o].rotation.z = a0 + (ao - a0) * e;       // 경첩이 펴지며 남은 팔이 바깥을 향함
      ab.userData.stem.rotation.z = s0 + (sT - s0) * e;
    }, () => {
      const m = mouthLocal(ab, o).applyQuaternion(ab.quaternion).add(ab.position);
      const e = ag.u.clone();
      const other = makeRBC(sel.d);
      const oa = other.userData.antigens.find(a => a.t === ag.t);
      const q = new THREE.Quaternion().setFromUnitVectors(oa.u, e.clone().negate());
      q.premultiply(new THREE.Quaternion().setFromAxisAngle(e, Math.floor(Math.random() * 3) * Math.PI * 2 / 3)); // 삼각형 모서리가 맞도록 120° 단위로만
      const target = m.clone().sub(oa.dock.clone().applyQuaternion(q));
      other.quaternion.copy(q);
      other.position.copy(target).addScaledVector(e, 6);
      rbc.add(other);
      far = Math.max(far, target.length() + R + 0.7);
      animate(900, t => { other.position.copy(target).addScaledVector(e, 6 * (1 - ease(t))); });
    }); }, 200 * i);
  });
  setTimeout(() => {
    if (L !== cur) return;
    L.zoomed = true;
    $('zoneD').style.opacity = $('zoneP').style.opacity = 0;
    rbc.updateMatrixWorld(true);
    const c = new THREE.Vector3().setFromMatrixPosition(rbc.matrixWorld);
    const half = Math.max(far * 0.85, 5), fit = fitCamera(c.x, c.y, half, half * 1.32);
    const aim = new THREE.Vector3(c.x, c.y - half * 0.3, 0);                   // 덩어리를 화면 위쪽으로 (아래에 기록 패널)
    const p0 = camera.position.clone(), p1 = new THREE.Vector3(aim.x, aim.y, fit.dist), t0 = camTarget.clone();
    animate(1200, t => { const e = ease(t); camera.position.lerpVectors(p0, p1, e); camTarget.lerpVectors(t0, aim, e); camera.lookAt(camTarget); }, () => {
      if (L !== cur) return;
      stamp(true);
      res('응집이 일어났어요! 응집소 하나가 두 적혈구의 응집원을 한꺼번에 붙잡아서, 적혈구끼리 엉겨 붙어 덩어리가 되었어요.', 'bad');
      finish(true);
    });
  }, 200 * bridges.length + 1500);
}

/* ④ 결과 기록 */
function finish(clumped) {
  L.done = true;
  setStep(4);
  L.tray.forEach(ab => { ab.userData.state = 'off'; });
  hint('');
  if (!clumped) stamp(false);
  act(`<p class="q">주는 사람 <b>${sel.d}형</b>의 혈액을 받는 사람 <b>${sel.r}형</b>에게 수혈할 수 있을까요?</p>
    <div class="choices"><button data-rec="1" class="ch yes">수혈할 수 있다</button><button data-rec="2" class="ch no">수혈할 수 없다</button></div>
    <button id="againBtn" class="link">처음부터 다시 하기</button>`);
  $('act').classList.remove('hide');
  $('againBtn').onclick = setup;
}

/* ---------- 누르기 · 끌기 ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -0.6);
let drag = null, lit = null;
function pointer(e) {
  const b = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - b.left) / b.width * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return { x: e.clientX - b.left, y: e.clientY - b.top };
}
function highlight(ag) {
  if (lit === ag) return;
  if (lit) lit.mats.forEach(m => m.emissive.setHex(0));
  lit = ag; if (lit) lit.mats.forEach(m => m.emissive.setHex(0x3a3a3a));
}
renderer.domElement.addEventListener('pointerdown', e => {
  if (!L) return;
  const p = pointer(e);
  renderer.domElement.setPointerCapture(e.pointerId);
  if (L.step === 1) {
    const h = ray.intersectObjects(L.cands, true)[0];
    if (h) chooseRBC(h.object.userData.rbc);
    return;
  }
  const h = ray.intersectObjects(L.tray, true)[0];
  const ab = h ? h.object.userData.ab : null;
  if (L.step === 2) { if (ab) togglePick(ab); return; }
  if (L.step === 3 && ab && ab.userData.state === 'tray') {
    const hp = new THREE.Vector3(); ray.ray.intersectPlane(dragPlane, hp);
    drag = { type: 'ab', ab, off: ab.position.clone().sub(hp) };
    ab.userData.state = 'drag';
  } else if (rbc) drag = { type: 'rot', x: p.x, y: p.y };
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pointer(e);
  if (drag.type === 'ab') {
    const hp = new THREE.Vector3();
    if (ray.ray.intersectPlane(dragPlane, hp)) { drag.ab.position.copy(hp.add(drag.off)); drag.ab.position.z = 0.6; }
    const n = nearestAntigen(drag.ab, p.x, p.y); highlight(n ? n.ag : null);
  } else {
    const dx = p.x - drag.x, dy = p.y - drag.y; drag.x = p.x; drag.y = p.y;
    rbc.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx * 0.01));
    rbc.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy * 0.01));
  }
});
function endDrag(e) {
  if (!drag) return;
  const p = pointer(e);
  if (drag.type === 'ab') onDrop(drag.ab, p.x, p.y);
  drag = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (b) { sel[b.dataset.k] = b.dataset.t; setup(); return; }
  const r = e.target.closest('button[data-rec]');
  if (r) {
    document.querySelectorAll('button[data-rec]').forEach(x => x.classList.toggle('sel', x === r));
    const v = +r.dataset.rec, txt = v === 1 ? '수혈할 수 있다' : '수혈할 수 없다';
    if (EMBED) { parent.postMessage({ type: 'bt-record', key: sel.r + '_' + sel.d, v, d: sel.d, r: sel.r }, '*'); res('우리 모둠 관계도에 기록하는 중이에요…'); }
    else res(`골랐어요: ${sel.d}형 → ${sel.r}형, ${txt}. 모둠 관계도 저장은 학생용 앱에서 돼요.`);
  }
});

addEventListener('message', e => {
  const m = e.data || {};
  if (m.type === 'bt-recorded') res(m.ok ? `우리 모둠 관계도에 기록했어요: ${m.d}형 → ${m.r}형 ${m.v === 1 ? '○' : '✕'}. 혈액형을 바꿔 다른 조합도 실험해 보세요.` : (m.msg || '기록하지 못했어요. 잠시 후 다시 눌러 보세요.'), m.ok ? 'ok' : 'no');
});

/* ---------- 매 프레임 ---------- */
const clock = new THREE.Clock();
function frame(now) {
  if (window.__pause) { requestAnimationFrame(frame); return; }   // 이미지 만들 때만 씀
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i], t = Math.min(1, (now - a.t0) / a.dur);
    a.step(t);
    if (t >= 1) { anims.splice(i, 1); a.done && a.done(); }
  }
  const time = clock.getElapsedTime();
  if (L && !reduce) {
    L.tray.forEach((ab, i) => {
      if (ab.userData.state !== 'tray' && ab.userData.state !== 'pick') return;
      ab.position.y = slots[ab.userData.x].y + Math.sin(time * 1.6 + i) * 0.06;
      ab.quaternion.copy(slotQ).premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.sin(time * 0.9 + i) * 0.22));
    });
    L.cands.forEach((c, i) => c.rotation.set(RBC_TILT.x, RBC_TILT.y + Math.sin(time * 0.8 + i * 1.7) * 0.25, 0));
  }
  if (L && L.chosen) {
    const s = project(L.chosen.position.clone().add(new THREE.Vector3(0, 1.25, 0)));
    $('ctag').style.left = s.x + 'px'; $('ctag').style.top = s.y + 'px';
  }
  if (L && !L.zoomed) L.tray.forEach(ab => {
    const el = document.getElementById('tag-' + ab.userData.x); if (!el) return;
    const s = project(slots[ab.userData.x].clone().add(new THREE.Vector3(0, -1.05, 0)));
    el.style.left = s.x + 'px'; el.style.top = s.y + 'px';
  });
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
new ResizeObserver(doLayout).observe(view);
setup();
requestAnimationFrame(frame);
$('plasmaBtn').onclick = checkPlasma;
$('rbcBtn').onclick = pickRBC;
window.__test = { get L() { return L; }, get rbc() { return rbc; }, camera, project, mouthWorld, slots, sel, THREE, renderer, scene, makeRBC, makeAntibody, RBC_TILT };
</script>
</body>
</html>
