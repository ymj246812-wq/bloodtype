<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수혈 관계 탐구 3D</title>
<style>
:root{--A:#14a38b;--B:#8b5cf6;--rbc:#d23245;--ok:#1b8a4b;--bad:#c92a3e;--line:#cfdae3;--bg:#eef3f7;--mute:#5d6f7d;--ink:#14222e;
  --donor:#c4304a;--donorBg:rgba(214,51,74,.07);--plasma:#a86d00;--plasmaBg:rgba(244,190,60,.17)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Malgun Gothic',system-ui,sans-serif;line-height:1.5}
main{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:1.3rem;margin:0 0 4px}
.note{color:var(--mute);font-size:.85rem;margin:0 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.row .lbl{min-width:7.5em;font-weight:700;font-size:.92rem}
.row .lbl.d{color:var(--donor)}.row .lbl.p{color:var(--plasma)}
button{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:inherit}
button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
button.go{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
button:focus-visible{outline:3px solid var(--B);outline-offset:2px}

/* 단계 표시 */
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;font-size:.85rem;padding:4px 10px 4px 6px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--mute)}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:1.4em;height:1.4em;margin-right:5px;border-radius:50%;background:#e3eaf0;font-weight:700;font-size:.8rem}
.steps li.now{border-color:var(--ink);color:var(--ink);font-weight:700}
.steps li.now::before{background:var(--ink);color:#fff}
.steps li.done{color:var(--ok)}.steps li.done::before{content:'✓';background:#dff3e6;color:var(--ok)}

/* 실험대 */
#view{position:relative;width:100%;height:min(68vh,600px);min-height:380px;border-radius:14px;overflow:hidden;background:#f4f7fa;border:1px solid var(--line);touch-action:none}
#view canvas{position:relative;z-index:1;display:block;width:100%;height:100%}
.zone{position:absolute;z-index:0;transition:opacity .6s}
.zone .zl{position:absolute;top:8px;left:12px;font-weight:700;font-size:.95rem;padding:2px 10px;border-radius:99px;background:#ffffffd9}
#zoneD{background:radial-gradient(90% 80% at 50% 50%,rgba(255,255,255,.9),var(--donorBg))}
#zoneD .zl{color:var(--donor);border:1.5px solid var(--donor)}
#zoneP{background:linear-gradient(180deg,rgba(255,236,170,.35),var(--plasmaBg));border-left:2px dashed #d9b25a}
#zoneP.tall{border-left:0;border-top:2px dashed #d9b25a}
#zoneP .zl{color:var(--plasma);border:1.5px solid #d9a227}
#tags{position:absolute;inset:0;z-index:2;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,0);text-align:center;font-size:.85rem;font-weight:700;white-space:nowrap;transition:opacity .4s}
.tag .pick{display:inline-block;margin-top:2px;padding:1px 8px;border-radius:99px;font-size:.75rem;background:#ffffffd9;border:1px dashed #9fb0bf;color:var(--mute);font-weight:400}
.tag .pick.on{border:1.5px solid var(--plasma);color:var(--plasma);font-weight:700;background:#fff6dc}
.hint{position:absolute;z-index:2;right:12px;top:12px;font-size:.78rem;color:var(--mute);pointer-events:none}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--mute);margin-top:8px;align-items:center}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.msg{margin-top:10px;padding:10px 14px;border-radius:10px;background:#fff;border-left:6px solid var(--line);font-weight:700;min-height:44px}
.msg.ok{border-color:var(--ok);color:var(--ok)}.msg.no,.msg.bad{border-color:var(--bad);color:var(--bad)}
#act{min-height:44px}
/* 혈장 완성 버튼: 혈장 구역 안 */
/* 제출 버튼: 크고 입체적인 버튼 + 은은한 반짝임 (누를 수 있을 때만) */
.submit{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:.45em;white-space:nowrap;
  padding:13px 26px 12px;border:0;border-radius:999px;font-size:1.12rem;font-weight:800;letter-spacing:-.01em;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 6px 0 var(--c3),0 12px 22px rgba(0,0,0,.22);
  transition:transform .08s,box-shadow .08s,filter .15s}
.submit .ic{display:inline-grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;background:#fff;color:var(--c2);font-size:.9em}
.submit:hover{filter:brightness(1.07)}
.submit:active{transform:translateY(5px);box-shadow:0 1px 0 var(--c3),0 4px 10px rgba(0,0,0,.2)}
.submit.ready::after{content:'';position:absolute;inset:-4px;border-radius:999px;border:3px solid var(--c1);animation:ring 1.6s ease-out infinite;pointer-events:none}
@keyframes ring{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.18,1.45)}}
#rbcBtn:disabled,#plasmaBtn:disabled{--c1:#c3ccd5;--c2:#aab5c0;--c3:#8e9aa6;cursor:not-allowed;filter:none}
.submit:disabled .ic{color:#9aa6b2}
.submit:disabled::after{display:none}
#plasmaBtn{--c1:#f2b322;--c2:#d48d00;--c3:#9c6500}
#rbcBtn{--c1:#e9506a;--c2:#c42a45;--c3:#8f1a2f}
@media (prefers-reduced-motion:reduce){.submit.ready::after{animation:none}}
.ctag{position:absolute;transform:translate(-50%,-100%);z-index:2;pointer-events:none;font-size:.82rem;font-weight:800;color:#fff;background:var(--donor);padding:2px 10px;border-radius:99px;box-shadow:0 3px 8px rgba(196,48,74,.35)}
/* 틀렸을 때: 큰 글자 + 흔들림 + 붉은 번쩍임 */
#boom{position:absolute;z-index:4;left:50%;top:45%;transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  font-size:clamp(2.4rem,8vw,4.6rem);font-weight:900;letter-spacing:.02em;color:#fff;background:var(--bad);
  padding:.08em .55em .12em;border-radius:18px;box-shadow:0 10px 30px rgba(201,42,62,.45);white-space:nowrap}
#boom.show{animation:boom 1.1s ease-out}
@keyframes boom{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}24%{transform:translate(-50%,-50%) scale(.95)}32%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#flash{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 6px var(--bad),inset 0 0 80px rgba(201,42,62,.35);border-radius:14px}
#flash.show{animation:flash .6s ease-out}
@keyframes flash{0%,40%{opacity:1}100%{opacity:0}}
#view.shake{animation:vshake .5s}
@keyframes vshake{0%,100%{transform:none}12%{transform:translateX(-14px) rotate(-.6deg)}26%{transform:translateX(12px) rotate(.5deg)}40%{transform:translateX(-10px)}55%{transform:translateX(8px)}70%{transform:translateX(-5px)}85%{transform:translateX(3px)}}
#soundBtn{position:absolute;z-index:3;left:10px;bottom:8px;padding:3px 9px;font-size:.78rem;background:#ffffffd9}
/* 세로 화면: 실험대를 더 길게, 안내 글자는 숨기고 소리 버튼은 오른쪽 위로 */
@media (max-aspect-ratio:1/1){#view{height:min(80vh,760px)}}
#view.tall .hint{display:none}
#view.tall #soundBtn{left:auto;right:10px;top:8px;bottom:auto}
#view.tall .submit{font-size:1.02rem;padding:11px 20px 10px}
@media (prefers-reduced-motion:reduce){#view.shake,#boom.show{animation:none}#boom.show{opacity:1}}
.hide{display:none!important}
</style>
</head>
<body><main>
<h1>🩸 수혈 관계 탐구 · 3D 실험대</h1>
<p class="note">3D 시제품이에요. 실험할 조합을 고른 뒤, 실험대를 직접 차려 보세요. (이 페이지는 저장 기능이 없어요)</p>

<div class="card">
  <div class="row"><span class="lbl d">주는 사람</span><span id="bd"></span></div>
  <div class="row"><span class="lbl p">받는 사람</span><span id="br"></span></div>
</div>

<ol class="steps" id="steps">
  <li>적혈구 고르기</li><li>혈장 만들기</li><li>맞춰 보기</li><li>결과 기록</li>
</ol>

<div id="view">
  <div class="zone" id="zoneD"><span class="zl" id="zlD"></span></div>
  <div class="zone" id="zoneP"><span class="zl" id="zlP"></span></div>
  <div id="tags"></div>
  <div class="hint" id="hint"></div>
  <button id="rbcBtn" class="submit hide"><span class="ic">✔</span><span class="tx">이 적혈구로 결정!</span></button>
  <button id="plasmaBtn" class="submit ready hide"><span class="ic">✔</span>혈장 완성! 제출하기</button>
  <div id="ctag" class="ctag hide">✔ 고른 적혈구</div>
  <div id="flash"></div>
  <div id="boom" aria-live="assertive"></div>
  <button id="soundBtn">🔊 소리 켜짐</button>
</div>
<div class="legend">
  <span><span class="dot" style="background:var(--A)"></span>응집원 A (삼각뿔 머리)</span>
  <span><span class="dot" style="background:var(--B)"></span>응집원 B (공 모양 머리)</span>
  <span><span class="dot" style="background:#5f7f9e"></span>응집소 (끝에 홈이 2개)</span>
</div>
<div id="res" class="msg"></div>
<div class="row" id="act" style="margin-top:8px"></div>
</main>

<script type="module">
import * as THREE from './lib/three.module.min.js';

/* =====================================================================
   모양 설정: 숫자를 바꾸면 3D 모형의 크기와 모양이 바뀝니다.
   ===================================================================== */
const SIZE = {
  rbcRadius: 1.6,       // 적혈구 반지름
  stalk: 0.32,          // 응집원 줄기 길이
  armLen: 0.7,          // 응집소 팔 길이
  stemLen: 0.8,         // 응집소 몸통 길이
  cupH: 0.46,           // 응집소 결합부위(홈 블록) 높이
  cupR: 0.3             // 결합부위 바깥 반지름
};
const COLOR = { A: 0x14a38b, B: 0x8b5cf6, rbc: 0xd23245, ab: 0x5f7f9e, pocket: 0xb9cde0 };
/* ===================================================================== */

const TY = ['A', 'B', 'AB', 'O'];
const ANTIGEN = { A: ['A'], B: ['B'], AB: ['A', 'B'], O: [] };
const ANTIBODY = { A: ['b'], B: ['a'], AB: [], O: ['a', 'b'] };
const FIT = { a: 'A', b: 'B' }, GREEK = { a: 'α', b: 'β' };
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 3D 기본 ---------- */
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
$('zoneP').after(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0xaebfd0, 1.4));
const key = new THREE.DirectionalLight(0xfff4e8, 2.4); key.position.set(5, 7, 9); scene.add(key);
const fill = new THREE.DirectionalLight(0xdbe8ff, 0.9); fill.position.set(-7, -3, 5); scene.add(fill);
const rimL = new THREE.DirectionalLight(0xffffff, 0.8); rimL.position.set(0, 4, -8); scene.add(rimL);

/* ---------- 모형 만들기 ---------- */
const R = SIZE.rbcRadius;
function rbcGeometry() {
  // 가운데가 오목한 원반 (적혈구 단면 곡선을 회전)
  const pts = [], N = 48, k = R * 0.9;
  const h = p => k * Math.sqrt(Math.max(0, 1 - p * p)) * (0.16 + 0.95 * p * p - 0.62 * p ** 4);
  for (let i = 0; i <= N; i++) { const p = Math.sin(i / N * Math.PI / 2); pts.push(new THREE.Vector2(p * R, h(p))); }
  for (let i = N - 1; i >= 0; i--) { const p = Math.sin(i / N * Math.PI / 2); pts.push(new THREE.Vector2(p * R, -h(p))); }
  const g = new THREE.LatheGeometry(pts, 96);
  g.rotateX(Math.PI / 2);
  return g;
}
const RBC_GEO = rbcGeometry();
const STALK_GEO = new THREE.CylinderGeometry(0.045, 0.06, SIZE.stalk + 0.08, 16);
const HEAD_A = new THREE.ConeGeometry(0.22, 0.36, 3); HEAD_A.translate(0, 0.18, 0);        // 삼각뿔, 밑면 중심이 원점
const HEAD_B = new THREE.SphereGeometry(0.18, 40, 24);                                     // 공, 중심이 원점
const DOCK_OUT = { A: R + SIZE.stalk, B: R + SIZE.stalk + 0.14 };                          // 중심에서 결합 기준점까지
const RBC_TILT = new THREE.Euler(-0.62, 0.3, 0);

function makeRBC(type) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhysicalMaterial({ color: COLOR.rbc, roughness: 0.42, clearcoat: 0.35, clearcoatRoughness: 0.5, sheen: 0.4, sheenColor: new THREE.Color(0xff9aa8) });
  const body = new THREE.Mesh(RBC_GEO, bodyMat);
  g.add(body);
  g.userData = { type, antigens: [], mats: [bodyMat] };
  const list = ANTIGEN[type];
  if (list.length) for (let i = 0; i < 6; i++) {
    const t = list[i % list.length], th = i / 6 * Math.PI * 2 + Math.PI / 6;
    const u = new THREE.Vector3(Math.cos(th), Math.sin(th), 0);
    const mat = new THREE.MeshStandardMaterial({ color: COLOR[t], roughness: 0.35, metalness: 0.05 });
    const hmat = mat.clone(); hmat.flatShading = t === 'A';
    const a = new THREE.Group();
    const stalk = new THREE.Mesh(STALK_GEO, mat); stalk.position.y = R - 0.04 + (SIZE.stalk + 0.08) / 2 - 0.04;
    const head = new THREE.Mesh(t === 'A' ? HEAD_A : HEAD_B, hmat);
    head.position.y = t === 'A' ? R + SIZE.stalk : DOCK_OUT.B;
    a.add(stalk, head);
    a.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), u);
    g.add(a);
    g.userData.antigens.push({ t, u, dock: u.clone().multiplyScalar(DOCK_OUT[t]), mats: [mat, hmat], bound: false });
    g.userData.mats.push(mat, hmat);
  }
  g.traverse(o => { if (o.isMesh) o.userData.rbc = g; });
  return g;
}

function cupGeometries(x) {
  // 바깥 블록과 홈(오목) 부분을 따로 만들어 홈 색을 밝게 보이게 합니다.
  const H = SIZE.cupH, Ro = x === 'a' ? 0.38 : SIZE.cupR, V = (a, b) => new THREE.Vector2(a, b);
  const pr = x === 'a' ? 0.25 : 0.2, seg = x === 'a' ? 3 : 48;
  const outer = [V(0, 0), V(Ro - 0.06, 0), V(Ro - 0.01, 0.04), V(Ro, 0.1), V(Ro, H - 0.05), V(Ro - 0.02, H - 0.005), V(pr + 0.02, H), V(pr, H)];
  const inner = [];
  if (x === 'a') { const depth = 0.38; for (let i = 0; i <= 8; i++) { const f = i / 8; inner.push(V(pr * (1 - f) + 0.0001, H - depth * f)); } }
  else { for (let i = 0; i <= 10; i++) { const t = i / 10 * Math.PI / 2; inner.push(V(pr * Math.cos(t) + 0.0001, H - pr * Math.sin(t))); } }
  return [new THREE.LatheGeometry(outer, seg), new THREE.LatheGeometry(inner, seg)];
}
const CUP = { a: cupGeometries('a'), b: cupGeometries('b') };
const ARM_GEO = new THREE.CylinderGeometry(0.085, 0.085, SIZE.armLen, 20); ARM_GEO.translate(0, SIZE.armLen / 2, 0);
const STEM_GEO = new THREE.CylinderGeometry(0.1, 0.1, SIZE.stemLen, 20); STEM_GEO.translate(0, SIZE.stemLen / 2, 0);
const HINGE_GEO = new THREE.SphereGeometry(0.13, 24, 16);
const ARM0 = THREE.MathUtils.degToRad(35);
const MOUTH = SIZE.armLen + SIZE.cupH;

function makeAntibody(x) {
  const g = new THREE.Group();
  const body = new THREE.MeshStandardMaterial({ color: COLOR.ab, roughness: 0.38, metalness: 0.12 });
  const pocket = new THREE.MeshStandardMaterial({ color: COLOR.pocket, roughness: 0.55, side: THREE.DoubleSide });
  const outerMat = body.clone(); outerMat.side = THREE.DoubleSide;
  if (x === 'a') { outerMat.flatShading = true; pocket.flatShading = true; }
  g.add(new THREE.Mesh(HINGE_GEO, body));
  const stem = new THREE.Group(); stem.rotation.z = Math.PI; stem.add(new THREE.Mesh(STEM_GEO, body)); g.add(stem);
  const arms = [-ARM0, ARM0].map(a => {
    const p = new THREE.Group(); p.rotation.z = a;
    p.add(new THREE.Mesh(ARM_GEO, body));
    const c1 = new THREE.Mesh(CUP[x][0], outerMat), c2 = new THREE.Mesh(CUP[x][1], pocket);
    c1.position.y = c2.position.y = SIZE.armLen;
    p.add(c1, c2); g.add(p); return p;
  });
  g.userData = { x, arms, stem, mats: [body, pocket, outerMat], state: 'tray' };
  g.traverse(o => { if (o.isMesh) o.userData.ab = g; });
  return g;
}
function glow(obj, on, hex) { obj.userData.mats.forEach(m => m.emissive && m.emissive.setHex(on ? (hex || 0x2f4a66) : 0)); }
function fade(obj, dur, done) {
  obj.userData.mats.forEach(m => { m.transparent = true; m.depthWrite = false; m.needsUpdate = true; });
  animate(dur, t => obj.userData.mats.forEach(m => m.opacity = 1 - t), () => { obj.parent && obj.parent.remove(obj); done && done(); });
}
// 팔 각도 a 에서 팔 방향(로컬)과 홈 입구 위치
const armDir = a => new THREE.Vector3(-Math.sin(a), Math.cos(a), 0);
function mouthLocal(ab, k) { return armDir(ab.userData.arms[k].rotation.z).multiplyScalar(MOUTH); }
function mouthWorld(ab, k) { ab.updateMatrixWorld(true); return mouthLocal(ab, k).applyMatrix4(ab.matrixWorld); }

/* ---------- 간단한 애니메이션 ---------- */
let anims = [];
function animate(dur, step, done) { anims.push({ t0: performance.now(), dur: reduce ? 1 : dur, step, done }); }
const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;
function tweenTo(obj, pos, quat, dur, done, scale) {
  const p0 = obj.position.clone(), q0 = obj.quaternion.clone(), s0 = obj.scale.x;
  animate(dur, t => {
    const e = ease(t); obj.position.lerpVectors(p0, pos, e); obj.quaternion.slerpQuaternions(q0, quat, e);
    if (scale != null) obj.scale.setScalar(s0 + (scale - s0) * e);
  }, done);
}
function wiggle(obj, axis, done) {
  const base = obj.quaternion.clone();
  animate(500, t => obj.quaternion.copy(base).premultiply(new THREE.Quaternion().setFromAxisAngle(axis, Math.sin(t * Math.PI * 6) * (1 - t) * 0.35)),
    () => { obj.quaternion.copy(base); done && done(); });
}

/* ---------- 화면 배치: 왼쪽(위) = 주는 사람 적혈구, 오른쪽(아래) = 받는 사람 혈장 ---------- */
let layout = 'wide';
const slots = { a: new THREE.Vector3(), b: new THREE.Vector3() }, slotQ = new THREE.Quaternion();
const candPos = [];
let candS = 0.4;           // 고르기 단계의 적혈구 크기 (세로 화면은 조금 작게)
const SPLIT = 2.75;            // 두 구역의 경계 (가로: x, 세로: y)
let camTarget = new THREE.Vector3(), camDist = 12;
function fitCamera(cx, cy, halfW, halfH) {
  const asp = view.clientWidth / view.clientHeight, f = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return { target: new THREE.Vector3(cx, cy, 0), dist: Math.max(halfH, halfW / asp) / f * 1.12 + 1 };
}
function doLayout() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  layout = w / h >= 1.05 ? 'wide' : 'tall';
  view.classList.toggle('tall', layout === 'tall');
  candPos.length = 0;
  if (layout === 'wide') {
    slots.a.set(4.4, 1.45, 0); slots.b.set(4.4, -0.95, 0);
    slotQ.setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2)            // 팔이 왼쪽(적혈구 쪽)을 향함
      .premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0.85)); // 홈 입구가 보이게 기울임
    candPos.push([-1.25, 1.35], [1.25, 1.35], [-1.25, -1.05], [1.25, -1.05]); candS = 0.4;
    const c = fitCamera(1.25, 0, 3.9, 2.75); camTarget = c.target; camDist = c.dist;
  } else {
    slots.a.set(-1.3, -4.3, 0); slots.b.set(1.3, -4.3, 0);
    slotQ.setFromAxisAngle(new THREE.Vector3(1, 0, 0), 0.85);                   // 팔이 위(적혈구 쪽), 홈 입구가 보이게 기울임
    candPos.push([-1.2, 1.55], [1.2, 1.55], [-1.2, -0.5], [1.2, -0.5]); candS = 0.34;
    const c = fitCamera(0, -2.05, 2.75, 4.75); camTarget = c.target; camDist = c.dist;
  }
  if (L) {
    L.tray.forEach(ab => { if (ab.userData.state === 'tray' || ab.userData.state === 'pick') { ab.position.copy(slots[ab.userData.x]); ab.quaternion.copy(slotQ); } });
    L.cands.forEach((c, i) => { c.position.set(candPos[i][0], candPos[i][1], 0); c.scale.setScalar(c === L.chosen ? candS * 1.25 : candS); });
  }
  if (!L || !L.zoomed) { camera.position.set(camTarget.x, camTarget.y, camDist); camera.lookAt(camTarget); }

}
function project(v) {
  const p = v.clone().project(camera);
  return { x: (p.x + 1) / 2 * view.clientWidth, y: (1 - p.y) / 2 * view.clientHeight };
}
function placeZones() {

    const x = Math.round(project(new THREE.Vector3(SPLIT, 0, 0)).x);

    Object.assign(zP, { left: x + 'px', top: '0', bottom: '0', right: '0', width: 'auto', height: 'auto' });
    const bottom = view.clientHeight - 16;                               // 각 구역의 아래 가운데
    Object.assign($('hint').style, { right: (view.clientWidth - x + 12) + 'px' });   // 안내 글자: 적혈구 구역 오른쪽 위
    Object.assign($('rbcBtn').style, { left: (x / 2) + 'px', top: bottom + 'px', transform: 'translate(-50%,-100%)' });
    Object.assign($('plasmaBtn').style, { left: ((x + view.clientWidth) / 2) + 'px', top: bottom + 'px', transform: 'translate(-50%,-100%)' });
  } else {
    const y = Math.round(project(new THREE.Vector3(0, -SPLIT, 0)).y);
    Object.assign(zD, { left: '0', right: '0', top: '0', bottom: 'auto', height: y + 'px', width: 'auto' });
    Object.assign(zP, { left: '0', right: '0', top: y + 'px', bottom: '0', height: 'auto', width: 'auto' });
    Object.assign($('rbcBtn').style, { left: '50%', top: (y - 14) + 'px', transform: 'translate(-50%,-100%)' });     // 적혈구 구역 아래 가운데
    const by = Math.round(project(new THREE.Vector3(0, -6.75, 0)).y);                                                // 응집소 아래 가운데
    Object.assign($('plasmaBtn').style, { left: '50%', top: by + 'px', transform: 'translate(-50%,-50%)' });
  }
}

/* ---------- 실험 진행 ---------- */
let sel = { d: 'A', r: 'B' }, L = null, rbc = null;
const tagsEl = $('tags');
function res(t, c) { $('res').className = 'msg ' + (c || ''); $('res').textContent = t; }
function act(html) { $('act').innerHTML = html; }
/* 틀렸을 때 효과: "아닙니다!" + 흔들림 + 삐빅 */
let audio = null, soundOn = true;
function beep() {
  if (!soundOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime;
    [[0, 1180], [0.13, 1180]].forEach(([d, f]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.09, t0 + d + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.09);
      o.connect(g).connect(audio.destination); o.start(t0 + d); o.stop(t0 + d + 0.1);
    });
  } catch (e) {}
}
function wrong(text) {
  const boom = $('boom'), fl = $('flash');
  boom.textContent = text || '아닙니다!';

  void view.offsetWidth;                       // 애니메이션을 처음부터 다시
  boom.classList.add('show'); fl.classList.add('show'); view.classList.add('shake');

}
$('soundBtn').onclick = () => { soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '🔊 소리 켜짐' : '🔇 소리 꺼짐'; };
function hint(t) { $('hint').textContent = t || ''; }
function setStep(n) {

}
function typeButtons(k) { return TY.map(t => `<button data-k="${k}" data-t="${t}" class="${sel[k] === t ? 'sel' : ''}">${t}형</button>`).join(''); }
const shuffle = a => a.map(v => [Math.random(), v]).sort((p, q) => p[0] - q[0]).map(p => p[1]);

function setup() {

/* ① 적혈구 고르기: 네 가지 적혈구 중 주는 사람의 것을 고릅니다 */
function stepPickRBC() {
  setStep(1);
  shuffle(TY).forEach((t, i) => {
    const c = makeRBC(t);
    c.position.set(candPos[i][0], candPos[i][1], 0);
    c.rotation.copy(RBC_TILT);
    c.scale.setScalar(0.01);
    c.userData.idx = i;
    scene.add(c); L.cands.push(c);
    animate(400, t2 => c.scale.setScalar(Math.max(0.01, candS * ease(t2))));
  });
  L.chosen = null;
  setRbcBtn();
  $('rbcBtn').classList.remove('hide');
  res(`① 주는 사람(${sel.d}형)의 적혈구는 어느 것일까요? 표면의 응집원을 잘 보고 하나를 누른 뒤 [이 적혈구로 결정!]을 누르세요.`);
  hint('적혈구를 눌러 고르기');
}
function setRbcBtn() {
  const b = $('rbcBtn'), on = !!L.chosen;
  b.disabled = !on; b.classList.toggle('ready', on);
  b.querySelector('.tx').textContent = on ? '이 적혈구로 결정!' : '적혈구를 먼저 눌러 고르세요';
  $('ctag').classList.toggle('hide', !on);
}
function chooseRBC(c) {
  const prev = L.chosen;
  L.chosen = prev === c ? null : c;                      // 같은 것을 다시 누르면 선택 취소
  [prev, L.chosen].forEach(o => {
    if (!o) return;
    const on = o === L.chosen, s0 = o.scale.x, s1 = on ? candS * 1.25 : candS;
    glow(o, on, 0x4a1a00);
    animate(200, t => o.scale.setScalar(s0 + (s1 - s0) * t));
  });
  setRbcBtn();
}
function pickRBC() {
  const c = L.chosen; if (!c) return;
  if (c.userData.type !== sel.d) {
    wiggle(c, new THREE.Vector3(0, 0, 1));
    wrong();
    res(`✕ ${sel.d}형 적혈구가 아니에요. 응집원의 모양과 종류를 다시 살펴보세요.`, 'no');
    chooseRBC(c);                                         // 선택을 풀고 다시 고르게
    return;
  }
  glow(c, false);
  $('rbcBtn').classList.add('hide'); $('ctag').classList.add('hide');
  L.cands.filter(o => o !== c).forEach(o => fade(o, 400));
  L.cands = []; L.chosen = null;
  rbc = c;
  tweenTo(c, new THREE.Vector3(0, 0, 0), new THREE.Quaternion().setFromEuler(RBC_TILT), 700, stepMakePlasma, 1);
  res(`✔ 맞아요! ${sel.d}형 적혈구를 실험대에 올렸어요.`, 'ok');
}

/* ② 혈장 만들기: 받는 사람의 혈장에 들어 있는 응집소를 고릅니다 */
function stepMakePlasma() {
  setStep(2);
  ['a', 'b'].forEach(x => {
    const ab = makeAntibody(x); ab.userData.state = 'pick'; ab.userData.picked = false;
    ab.position.copy(slots[x]); ab.quaternion.copy(slotQ); ab.scale.setScalar(0.01);
    animate(350, t => ab.scale.setScalar(Math.max(0.01, ease(t))));
    scene.add(ab); L.tray.push(ab);
  });
  drawTags();
  res(`② 받는 사람(${sel.r}형)의 혈장에는 어떤 응집소가 들어 있을까요? 들어 있는 응집소를 모두 눌러 고른 뒤 [혈장 완성! 제출하기]를 누르세요. 하나도 없다면 아무것도 고르지 않고 누르면 돼요.`);
  $('plasmaBtn').classList.remove('hide');
  hint('응집소를 눌러 고르기 / 다시 누르면 빼기');
}
function drawTags() {
  tagsEl.innerHTML = L.tray.map(ab => {
    const x = ab.userData.x, st = ab.userData.state;
    const pick = st === 'pick' ? `<br><span class="pick ${ab.userData.picked ? 'on' : ''}">${ab.userData.picked ? '✔ 혈장에 넣음' : '눌러서 넣기'}</span>` : '';

  }).join('');
}
function togglePick(ab) {

  glow(ab, ab.userData.picked, 0x7a5200);
  const s0 = ab.scale.x, s1 = ab.userData.picked ? 1.12 : 1;
  animate(200, t => ab.scale.setScalar(s0 + (s1 - s0) * t));
  drawTags();
}
function checkPlasma() {
  const picked = L.tray.filter(ab => ab.userData.picked).map(ab => ab.userData.x).sort().join('');
  if (picked !== ANTIBODY[sel.r].slice().sort().join('')) {
    L.tray.filter(ab => ab.userData.picked).forEach(ab => wiggle(ab, new THREE.Vector3(0, 0, 1)));
    wrong();
    res(`✕ ${sel.r}형의 혈장과 달라요. ${sel.r}형 사람의 혈장에 어떤 응집소가 있는지 다시 생각해 보세요.`, 'no');
    return;
  }
  L.tray.filter(ab => !ab.userData.picked).forEach(ab => fade(ab, 400));
  L.tray = L.tray.filter(ab => ab.userData.picked);
  L.tray.forEach(ab => { glow(ab, false); ab.scale.setScalar(1); ab.userData.state = 'tray'; });
  $('plasmaBtn').classList.add('hide');

}

/* ③ 맞춰 보기 */
function stepTry() {
  setStep(3);
  drawTags();
  if (!L.tray.length) {
    res(`✔ 맞아요! ${sel.r}형의 혈장에는 응집소가 없어요. 적혈구에 붙을 응집소가 없으니 적혈구는 어떻게 될까요?`, 'ok');
    return finish(false);
  }
  if (!rbc.userData.antigens.length) {
    res(`✔ 혈장 완성! 그런데 ${sel.d}형 적혈구에는 응집원이 없어 응집소가 끼워질 곳이 없어요. 적혈구는 어떻게 될까요?`, 'ok');
    return finish(false);
  }
  res(`✔ 혈장 완성! ③ 혈장의 응집소를 끌어다 적혈구의 응집원에 맞춰 보세요. 홈 모양이 맞아야 끼워져요.`, 'ok');
  hint('응집소 끌기: 맞춰 보기 · 빈 곳 끌기: 적혈구 돌려 보기');
}

function dockTarget(ab, k, ag) {
  // 적혈구(로컬) 좌표에서: 팔 k 의 방향이 응집원 안쪽(-u)을 향하고, 홈 입구가 결합 기준점에 오도록
  const q = new THREE.Quaternion().setFromUnitVectors(armDir(ab.userData.arms[k].rotation.z), ag.u.clone().negate());
  const p = ag.dock.clone().sub(mouthLocal(ab, k).applyQuaternion(q));
  return { p, q };
}
function dock(ab, k, ag, delay) {
  ag.bound = true; ab.userData.state = 'docked'; ab.userData.dockArm = k; ab.userData.ag = ag;
  const host = rbc;
  setTimeout(() => {
    if (host !== rbc) { scene.remove(ab); return; }
    rbc.attach(ab);
    const { p, q } = dockTarget(ab, k, ag);
    tweenTo(ab, p, q, 650);
  }, delay);
  L.docked.push(ab);
}
function nearestAntigen(ab, px, py) {
  let best = null, bd = 75;
  rbc.updateMatrixWorld(true);
  rbc.userData.antigens.forEach(ag => {
    if (ag.bound) return;
    const s = project(ag.dock.clone().applyMatrix4(rbc.matrixWorld));
    const cands = [[px, py, -1], ...[0, 1].map(k => { const m = project(mouthWorld(ab, k)); return [m.x, m.y, k]; })];
    cands.forEach(([x, y, k]) => { const d = Math.hypot(x - s.x, y - s.y); if (d < bd) { bd = d; best = { ag, k }; } });
  });
  if (best && best.k === -1) {
    const s = project(best.ag.dock.clone().applyMatrix4(rbc.matrixWorld));
    const d = [0, 1].map(k => { const m = project(mouthWorld(ab, k)); return Math.hypot(m.x - s.x, m.y - s.y); });
    best.k = d[0] <= d[1] ? 0 : 1;
  }
  return best;
}
function backToTray(ab) { tweenTo(ab, slots[ab.userData.x], slotQ, 400, () => { if (ab.userData.state === 'busy') ab.userData.state = 'tray'; }); }

function onDrop(ab, px, py) {
  highlight(null);
  const hit = nearestAntigen(ab, px, py);
  const x = ab.userData.x;
  if (!hit) { ab.userData.state = 'busy'; backToTray(ab); return; }
  if (FIT[x] !== hit.ag.t) {
    ab.userData.state = 'busy';
    wiggle(ab, new THREE.Vector3(0, 0, 1), () => backToTray(ab));
    wrong();
    (L.tried[x] = L.tried[x] || new Set()).add(hit.ag.t);
    // 혈장의 모든 응집소를 적혈구의 모든 응집원에 맞춰 봤는데 맞는 게 없으면 끝
    const kinds = new Set(ANTIGEN[sel.d]);
    const allTried = L.tray.every(o => [...kinds].every(g => FIT[o.userData.x] !== g ? (L.tried[o.userData.x] || new Set()).has(g) : false));
    if (allTried) {
      res(`✕ 응집소 ${GREEK[x]}의 홈에는 응집원 ${hit.ag.t}가 들어가지 않아요. 혈장의 응집소 중 이 적혈구의 응집원에 맞는 것이 하나도 없어요. 적혈구는 어떻게 될까요?`, 'no');
      setTimeout(() => finish(false), 700);
    } else res(`✕ 응집소 ${GREEK[x]}의 홈에는 응집원 ${hit.ag.t}가 들어가지 않아요. 다른 응집원이나 다른 응집소로도 해 보세요.`, 'no');
    return;
  }
  // 맞음: 끌어온 응집소가 결합하고, 같은 응집원 자리마다 같은 응집소가 따라 붙습니다
  const g = hit.ag.t;
  dock(ab, hit.k, hit.ag, 0);
  let n = 0;
  rbc.userData.antigens.forEach(ag => {
    if (ag.bound || ag.t !== g) return;
    const c = makeAntibody(x); c.userData.state = 'docked';
    c.position.copy(slots[x]); c.quaternion.copy(slotQ); scene.add(c);
    dock(c, n % 2, ag, 160 * (++n));
  });
  L.tray = L.tray.filter(o => o !== ab);
  res(`✔ OK! 응집소 ${GREEK[x]}의 홈에 응집원 ${g}가 딱 맞아요. 어떻게 되는지 지켜보세요…`, 'ok');
  const cur = L;
  setTimeout(() => { if (L === cur) clump(); }, 160 * n + 800);
}

/* 응집: 응집소가 남은 홈으로 다른 적혈구를 붙잡아 엉겨 붙는 모습 */
function clump() {
  const cur = L;
  L.tray.forEach(ab => { ab.userData.state = 'off'; fade(ab, 400); });
  L.tray = []; tagsEl.innerHTML = ''; hint('');
  const bridges = L.docked.slice(0, 6).filter((_, i) => i % 2 === 0);
  let far = 0;
  bridges.forEach((ab, i) => {
    const k = ab.userData.dockArm, o = 1 - k, ag = ab.userData.ag;
    const ak = ab.userData.arms[k].rotation.z, ao = ak + Math.PI, s0 = ab.userData.stem.rotation.z;
    const gap = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
    const sT = [ak + Math.PI / 2, ak - Math.PI / 2].sort((a, b) => gap(a, s0) - gap(b, s0))[0];
    const a0 = ab.userData.arms[o].rotation.z;
    setTimeout(() => { if (L !== cur) return; animate(600, t => {
      const e = ease(t);
      ab.userData.arms[o].rotation.z = a0 + (ao - a0) * e;       // 경첩이 펴지며 남은 팔이 바깥을 향함
      ab.userData.stem.rotation.z = s0 + (sT - s0) * e;
    }, () => {
      const m = mouthLocal(ab, o).applyQuaternion(ab.quaternion).add(ab.position);
      const e = ag.u.clone();
      const other = makeRBC(sel.d);
      const oa = other.userData.antigens.find(a => a.t === ag.t);
      const q = new THREE.Quaternion().setFromUnitVectors(oa.u, e.clone().negate());
      q.premultiply(new THREE.Quaternion().setFromAxisAngle(e, Math.floor(Math.random() * 3) * Math.PI * 2 / 3)); // 삼각형 모서리가 맞도록 120° 단위로만
      const target = m.clone().sub(oa.dock.clone().applyQuaternion(q));
      other.quaternion.copy(q);
      other.position.copy(target).addScaledVector(e, 6);
      rbc.add(other);
      far = Math.max(far, target.length() + R + 0.7);
      animate(900, t => { other.position.copy(target).addScaledVector(e, 6 * (1 - ease(t))); });
    }); }, 200 * i);
  });
  setTimeout(() => {
    if (L !== cur) return;
    L.zoomed = true;
    $('zoneD').style.opacity = $('zoneP').style.opacity = 0;
    rbc.updateMatrixWorld(true);
    const c = new THREE.Vector3().setFromMatrixPosition(rbc.matrixWorld);
    const fit = fitCamera(c.x, c.y, Math.max(far * 0.88, 5), Math.max(far * 0.88, 5));
    const p0 = camera.position.clone(), p1 = new THREE.Vector3(c.x, c.y, fit.dist), t0 = camTarget.clone();
    animate(1200, t => { const e = ease(t); camera.position.lerpVectors(p0, p1, e); camTarget.lerpVectors(t0, c, e); camera.lookAt(camTarget); });
    res('✔ 응집소가 다른 적혈구까지 붙잡아 적혈구들이 엉겨 붙었어요! 이런 현상을 무엇이라고 할까요?', 'bad');
    finish(true);
  }, 200 * bridges.length + 1500);
}

/* ④ 결과 기록 */
function finish() {
  L.done = true;
  setStep(4);
  L.tray.forEach(ab => { ab.userData.state = 'off'; });
  act(`<span style="font-weight:700">④ ${sel.d}형 → ${sel.r}형 수혈은?</span>
    <button data-rec="1">○ 수혈 가능</button><button data-rec="2">✕ 수혈 불가</button>
    <button id="againBtn">↺ 처음부터 다시</button>`);
  $('againBtn').onclick = setup;
}

/* ---------- 누르기 · 끌기 ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -0.6);
let drag = null, lit = null;
function pointer(e) {
  const b = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - b.left) / b.width * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return { x: e.clientX - b.left, y: e.clientY - b.top };
}
function highlight(ag) {
  if (lit === ag) return;
  if (lit) lit.mats.forEach(m => m.emissive.setHex(0));
  lit = ag; if (lit) lit.mats.forEach(m => m.emissive.setHex(0x3a3a3a));
}
renderer.domElement.addEventListener('pointerdown', e => {
  if (!L) return;
  const p = pointer(e);
  renderer.domElement.setPointerCapture(e.pointerId);
  if (L.step === 1) {
    const h = ray.intersectObjects(L.cands, true)[0];
    if (h) chooseRBC(h.object.userData.rbc);
    return;
  }
  const h = ray.intersectObjects(L.tray, true)[0];
  const ab = h ? h.object.userData.ab : null;
  if (L.step === 2) { if (ab) togglePick(ab); return; }
  if (L.step === 3 && ab && ab.userData.state === 'tray') {
    const hp = new THREE.Vector3(); ray.ray.intersectPlane(dragPlane, hp);
    drag = { type: 'ab', ab, off: ab.position.clone().sub(hp) };
    ab.userData.state = 'drag';
  } else if (rbc) drag = { type: 'rot', x: p.x, y: p.y };
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pointer(e);
  if (drag.type === 'ab') {
    const hp = new THREE.Vector3();
    if (ray.ray.intersectPlane(dragPlane, hp)) { drag.ab.position.copy(hp.add(drag.off)); drag.ab.position.z = 0.6; }
    const n = nearestAntigen(drag.ab, p.x, p.y); highlight(n ? n.ag : null);
  } else {
    const dx = p.x - drag.x, dy = p.y - drag.y; drag.x = p.x; drag.y = p.y;
    rbc.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx * 0.01));
    rbc.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy * 0.01));
  }
});
function endDrag(e) {
  if (!drag) return;
  const p = pointer(e);
  if (drag.type === 'ab') onDrop(drag.ab, p.x, p.y);
  drag = null;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (b) { sel[b.dataset.k] = b.dataset.t; setup(); return; }
  const r = e.target.closest('button[data-rec]');
  if (r) {
    document.querySelectorAll('button[data-rec]').forEach(x => x.classList.toggle('sel', x === r));
    res(`관계도에 ${sel.d}형 → ${sel.r}형: ${r.dataset.rec === '1' ? '○ 수혈 가능' : '✕ 수혈 불가'}(으)로 기록했어요. (시제품이라 저장되지는 않아요)`);
  }
});

/* ---------- 매 프레임 ---------- */
const clock = new THREE.Clock();
function frame(now) {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i], t = Math.min(1, (now - a.t0) / a.dur);
    a.step(t);
    if (t >= 1) { anims.splice(i, 1); a.done && a.done(); }
  }
  const time = clock.getElapsedTime();
  if (L && !reduce) {
    L.tray.forEach((ab, i) => {
      if (ab.userData.state !== 'tray' && ab.userData.state !== 'pick') return;
      ab.position.y = slots[ab.userData.x].y + Math.sin(time * 1.6 + i) * 0.06;
      ab.quaternion.copy(slotQ).premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.sin(time * 0.9 + i) * 0.22));
    });
    L.cands.forEach((c, i) => c.rotation.set(RBC_TILT.x, RBC_TILT.y + Math.sin(time * 0.8 + i * 1.7) * 0.25, 0));
  }
  if (L && L.chosen) {
    const s = project(L.chosen.position.clone().add(new THREE.Vector3(0, 1.25, 0)));
    $('ctag').style.left = s.x + 'px'; $('ctag').style.top = s.y + 'px';
  }
  if (L && !L.zoomed) L.tray.forEach(ab => {
    const el = document.getElementById('tag-' + ab.userData.x); if (!el) return;
    const s = project(slots[ab.userData.x].clone().add(new THREE.Vector3(0, -1.05, 0)));
    el.style.left = s.x + 'px'; el.style.top = s.y + 'px';
  });
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
new ResizeObserver(doLayout).observe(view);
setup();
requestAnimationFrame(frame);
$('plasmaBtn').onclick = checkPlasma;
$('rbcBtn').onclick = pickRBC;
window.__test = { get L() { return L; }, get rbc() { return rbc; }, camera, project, mouthWorld, slots, sel };
</script>
</body>
